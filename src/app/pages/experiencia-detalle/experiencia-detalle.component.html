<ion-content class="detail-content" [@fadeIn]>
  <!-- Back button -->
  <div class="detail-nav">
    <button class="back-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
      <span>Back</span>
    </button>
  </div>

  <div class="detail-container" *ngIf="experiencia">
    <!-- Header -->
    <div class="detail-header">
      <div class="detail-logo" *ngIf="experiencia.logo">
        <img [src]="experiencia.logo" [alt]="experiencia.titulo" />
      </div>
      <div class="detail-badge">
        <ion-icon [name]="experiencia.icono"></ion-icon>
        <span>{{ experiencia.cargo }}</span>
      </div>
      <h1 class="detail-title">{{ experiencia.titulo }}</h1>
      <p class="detail-period">{{ experiencia.periodo }}</p>
    </div>

    <!-- Tech Stack -->
    <div class="detail-tech">
      <h3>Tech Stack</h3>
      <p>{{ experiencia.tecnologiasResumen }}</p>
    </div>

    <!-- Description -->
    <div class="detail-description">
      <h3>Overview</h3>
      <p>{{ experiencia.descripcionGeneral }}</p>
    </div>

    <!-- Bullet Points -->
    <div class="detail-bullets" @staggerList>
      <h3>Key Contributions</h3>
      <div class="bullet-item" *ngFor="let punto of experiencia.bullets">
        <div class="bullet-dot">
          <ion-icon name="checkmark-outline"></ion-icon>
        </div>
        <p>{{ punto }}</p>
      </div>
    </div>

    <!-- Technologies Used -->
    <div class="detail-final-tech">
      <h3>Technologies & Tools</h3>
      <p>{{ experiencia.tecnologiasFinales }}</p>
    </div>
  </div>
</ion-content>
